tags:
  - Auth
summary: Login user
operationId: loginUser
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: olena@example.com
          password:
            type: string
            example: StrongPass123*
responses:
  '200':
    description: Successfully logged in
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: ABC123...==
  '401':
    $ref: '../../components/responses/401.yaml'

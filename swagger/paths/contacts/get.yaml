tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of users with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number (pagination)
    schema:
      type: integer
      default: 1
      example: 1
  - in: query
    name: perPage
    description: Number of contacts per page
    schema:
      type: integer
      default: 4
      example: 10
  - in: query
    name: sortBy
    description: 'Field to sort by (default: _id)'
    schema:
      type: string
      default: _id
      example: 'name'
  - in: query
    name: sortOrder
    description: Sorting order (asc or desc)
    schema:
      type: string
      enum: ['asc', 'desc']
      default: asc
      example: 'asc'
  - in: query
    name: contactType
    description: Filter contacts by type
    schema:
      type: string
      enum: [work, personal, home]
      example: personal
  - in: query
    name: isFavourite
    description: Filter only favourite contacts
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 2
                perPage:
                  type: integer
                  example: 4
                totalItems:
                  type: integer
                  example: 12
                totalPages:
                  type: integer
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'

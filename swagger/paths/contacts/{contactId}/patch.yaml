tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact by ID. You can update one or multiple fields and optionally attach a new photo.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: John Smith
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380931112233'
          email:
            type: string
            description: Contact's email
            example: 'olena@gmail.com'
          isFavourite:
            type: boolean
            description: Mark contact as favourite
            example: true
          contactType:
            type: string
            enum: [work, personal, home]
            description: Type of contact
            example: work
          photo:
            type: string
            format: binary
            description: Optional new photo for the contact
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'

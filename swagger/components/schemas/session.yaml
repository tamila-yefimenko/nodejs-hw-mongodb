type: object
required:
  - userId
  - accessToken
  - refreshToken
  - accessTokenValidUntil
  - refreshTokenValidUntil
properties:
  _id:
    type: string
    format: uuid
    example: 64fa0e12b5c4a24fef123abc
  userId:
    type: string
    format: uuid
    description: ID of the user who owns the session
    example: 65e4decdd286b30065d54af9
  accessToken:
    type: string
    description: Access token for the current session
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  refreshToken:
    type: string
    description: Refresh token for prolonging the session
    example: dGhpcyBpcyByZWZyZXNoIHRva2Vu...
  accessTokenValidUntil:
    type: string
    format: date-time
    description: Access token expiration timestamp
    example: 2025-07-11T17:45:00.000Z
  refreshTokenValidUntil:
    type: string
    format: date-time
    description: Refresh token expiration timestamp
    example: 2025-08-10T17:45:00.000Z
  createdAt:
    type: string
    format: date-time
    description: When the session was created
    example: 2025-07-11T16:30:00.000Z
  updatedAt:
    type: string
    format: date-time
    description: When the session was last updated
    example: 2025-07-11T16:30:00.000Z

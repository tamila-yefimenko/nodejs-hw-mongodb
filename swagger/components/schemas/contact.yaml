type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+390675647688'
  email:
    description: "Contacts's email"
    type: string
    example: 'contactsemail@gmail.com'
  isFavourite:
    description: 'Shows favourite contacts'
    type: boolean
    example: false
  contactType:
    description: 'Shows type of contact'
    type: string
    enum: ['work', 'personal', 'home']
  photo:
    description: "Link to user's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  userId:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9

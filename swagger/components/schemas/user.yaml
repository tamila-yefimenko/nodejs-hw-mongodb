type: object
required:
  - name
  - email
  - role
properties:
  _id:
    type: string
    format: uuid
    example: 65e4decdd286b30065d54af9
  name:
    type: string
    description: Name of the user
    example: John Doe
  email:
    type: string
    format: email
    description: Email address of the user
    example: johndoe@example.com
  role:
    type: string
    description: Role of the user
    enum:
      - admin
      - user
    example: user
  createdAt:
    type: string
    format: date-time
    description: Timestamp of user creation
    example: 2025-07-11T12:34:56.789Z
  updatedAt:
    type: string
    format: date-time
    description: Timestamp of last update
    example: 2025-07-11T13:00:00.000Z
